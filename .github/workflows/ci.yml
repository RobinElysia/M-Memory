name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check memory_system/

      - name: Type check (mypy)
        run: mypy --strict memory_system/

      - name: Test (pytest)
        run: pytest tests/ --cov=memory_system --cov-report=term-missing --cov-fail-under=80

      - name: Security audit
        run: pip-audit || true
