site_name: m-memory 技术文档
site_description: 双层记忆系统 — AI Agent 长程记忆基础设施
repo_url: https://github.com/RobinElysia/M-Memory
repo_name: M-Memory

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            show_if_no_docstring: false
            filters:
              - "!^_"

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 架构详解:
    - 总体设计: architecture-overview.md
    - 双层检索: architecture/search-pipeline.md
    - 分桶与聚类: architecture/bucket-clustering.md
    - 图结构与游走: architecture/graph-traversal.md
    - 冲突消解: architecture/conflict-resolution.md
    - 后台维护: architecture/cleanup.md
  - 使用指南:
    - 快速开始: guide/getting-started.md
    - 记忆摄入: guide/ingestion.md
    - 检索与查询: guide/search.md
    - 配置调优: guide/configuration.md
  - 模块源码:
    - retrieval.py: modules/retrieval.md
    - bucket_manager.py: modules/bucket_manager.md
    - graph_engine.py: modules/graph_engine.md
    - vector_store.py: modules/vector_store.md
    - cleanup.py: modules/cleanup.md
    - llm_decision.py: modules/llm_decision.md
    - config.py: modules/config.md
  - API 参考: api/index.md
  - API 手册:
    - 检索引擎: api/retrieval.md
    - 桶管理器: api/bucket_manager.md
    - 向量存储: api/vector_store.md
    - 图引擎: api/graph_engine.md
  - 合同: contracts.md
